{% extends "base.html" %}
{% block title %}New Ticket · IT Help Desk{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-9">
<div class="mb-4"><h1 class="fw-bold">Create Support Ticket</h1><p class="text-muted">Capture the issue clearly so the support team can resolve it efficiently.</p></div>
<form method="post" class="card shadow-sm">
<div class="card-body p-4">
<div class="row g-3">
<div class="col-md-8"><label class="form-label fw-semibold">Issue Title *</label><input name="title" class="form-control" placeholder="e.g. Laptop cannot connect to Wi-Fi" required></div>
<div class="col-md-4"><label class="form-label fw-semibold">Priority *</label><select name="priority" class="form-select" required>{% for x in ["Low","Medium","High","Critical"] %}<option>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Requester Name *</label><input name="requester_name" class="form-control" placeholder="Employee name" required></div>
<div class="col-md-6"><label class="form-label fw-semibold">Requester Email *</label><input name="requester_email" type="email" class="form-control" placeholder="employee@company.com" required></div>
<div class="col-md-6"><label class="form-label fw-semibold">Category *</label><select name="category" class="form-select" required>{% for x in ["Hardware","Software","Network","Access","Email","Other"] %}<option>{{ x }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Assign To</label><input name="assigned_to" class="form-control" placeholder="e.g. IT Support"></div>
<div class="col-12"><label class="form-label fw-semibold">Issue Description *</label><textarea name="description" rows="6" class="form-control" placeholder="Describe the problem, error message and any troubleshooting already attempted." required></textarea></div>
</div>
</div>
<div class="card-footer bg-white p-4 d-flex justify-content-end gap-2"><a href="{{ url_for('tickets') }}" class="btn btn-outline-secondary">Cancel</a><button class="btn btn-primary">Create Ticket</button></div>
</form>
</div></div>
{% endblock %}
